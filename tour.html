document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 opacity: 0.7;\">THE MEETING PLACE<\u002Fdiv>\n      <\u002Fa>\n    <\u002Fdiv>\n    <nav style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px clamp(14px, 2.4vw, 32px);\">\n      \n      <a href=\"#visit\" style=\"font-size: 11.5px; letter-spacing: 0.14em; opacity: 0.85;\">VISIT<\u002Fa>\n      <a href=\"https://dist-lemon-xi-43.vercel.app/facilities.html#spaces\" target=\"_blank\" rel=\"noopener\" style=\"background: #E8DFB0; color: #151D2A; border-radius: 999px; padding: 9px 20px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.1em;\" style-hover=\"background: #F6F0D4; color: #151D2A;\">BOOK<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section id=\"theatre\" data-screen-label=\"Tour Player\" style=\"padding: clamp(40px, 6vw, 70px) clamp(18px, 6vw, 84px) clamp(30px, 5vw, 60px); scroll-margin-top: 84px; animation: th-rise 0.6s ease both;\">\n    <div style=\"max-width: 1180px; margin: 0 auto;\">\n\n      <a href=\"index.html#top\" style=\"display: inline-flex; align-items: center; gap: 9px; border: 1px solid rgba(232,223,176,0.35); border-radius: 999px; padding: 9px 17px 9px 14px; font-size: 11.5px; font-weight: 600; letter-spacing: 0.47em; white-space: nowrap; transition: background 0.3s ease, border-color 0.3s ease; text-align: right; border-width: 0px; border-color: #FFFFFF59; width: 78px; height: 14px; position: absolute; left: 1023.6125px; top: 134.2px\" style-hover=\"background: rgba(232,223,176,0.12); border-color: rgba(232,223,176,0.6);\">\n        <span style=\"font-size: 14px; line-height: 1;\">←<\u002Fspan>BACK\n      <\u002Fa><div style=\"margin-bottom: clamp(26px, 4vw, 40px);\">\n        <div style=\"font-size: 11px; letter-spacing: 0.28em; opacity: 0.55; margin-bottom: 14px;\">VIRTUAL EXPERIENCE<\u002Fdiv>\n        <h1 style=\"font-size: clamp(30px, 5.4vw, 56px); font-weight: 600; line-height: 1.06; margin: 0 0 16px; letter-spacing: -0.005em; text-wrap: balance;\">The tour of the spaces<\u002Fh1>\n        \n      <\u002Fdiv>\n\n      <div role=\"tablist\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; margin-bottom: clamp(20px, 3vw, 28px);\">\n        <sc-for list=\"{{ tabs }}\" as=\"tab\" hint-placeholder-count=\"4\">\n          <button type=\"button\" role=\"tab\" sc-camel-on-click=\"{{ tab.onSelect }}\" style=\"cursor: pointer; text-align: left; font-family: inherit; display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 12px; border: 1px solid {{ tab.border }}; background: {{ tab.bg }}; color: #E8DFB0; transition: border-color 0.3s ease, background 0.3s ease, transform 0.3s ease;\" style-hover=\"transform: translateY(-2px);\">\n            <span style=\"font-size: 11px; letter-spacing: 0.22em; opacity: {{ tab.numOpacity }}; min-width: 20px;\">{{ tab.num }}<\u002Fspan>\n            <span style=\"display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: clamp(15px, 2.2vw, 17px); font-weight: 600; letter-spacing: 0.01em;\">{{ tab.name }}<\u002Fspan>\n              <span style=\"font-size: 12px; font-weight: 400; opacity: 0.62;\">{{ tab.tagline }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"margin-left: auto; font-size: 11px; letter-spacing: 0.16em; opacity: {{ tab.stateOpacity }}; white-space: nowrap;\">{{ tab.stateLabel }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #0F1520; border: 1px solid rgba(232,223,176,0.18); box-shadow: 0 30px 80px rgba(0,0,0,0.45);\">\n        <video ref=\"{{ playerRef }}\" src=\"{{ activeSrc }}\" controls=\"controls\" playsinline=\"playsinline\" preload=\"metadata\" sc-camel-on-play=\"{{ onPlay }}\" style=\"width: 100%; height: 100%; display: block; object-fit: cover; background: #0F1520;\"><\u002Fvideo>\n        <div sc-camel-on-click=\"{{ onStart }}\" style=\"position: absolute; inset: 0; display: {{ coverDisplay }}; flex-direction: column; align-items: center; justify-content: center; gap: 18px; cursor: pointer; background: linear-gradient(180deg, rgba(15,21,32,0.72) 0%, rgba(15,21,32,0.88) 100%); animation: th-fade 0.4s ease both;\">\n          <div style=\"width: clamp(64px, 9vw, 88px); height: clamp(64px, 9vw, 88px); border-radius: 50%; border: 1px solid rgba(232,223,176,0.55); display: flex; align-items: center; justify-content: center; background: rgba(232,223,176,0.1); transition: background 0.3s ease, transform 0.3s ease;\" style-hover=\"background: #E8DFB0; transform: scale(1.06);\">\n            <span style=\"font-size: clamp(20px, 3vw, 26px); margin-left: 5px;\">▶<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"text-align: center; padding: 0 24px;\">\n            <div style=\"font-size: clamp(19px, 3.4vw, 28px); font-weight: 600; letter-spacing: 0.01em; margin-bottom: 8px;\">{{ activeName }}<\u002Fdiv>\n            <div style=\"font-size: 12px; letter-spacing: 0.18em; opacity: 0.65;\">PLAY WITH SOUND<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; margin-top: 14px; font-size: 11.5px; letter-spacing: 0.06em; opacity: 0.55;\">\n        <div>Filmed on site. Best with sound on.<\u002Fdiv>\n        <div>{{ activeCounter }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"detail\" data-screen-label=\"Space Detail\" style=\"padding: clamp(30px, 5vw, 56px) clamp(18px, 6vw, 84px) clamp(60px, 9vw, 110px); scroll-margin-top: 84px;\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: clamp(34px, 5vw, 70px); align-items: start;\">\n\n      <div>\n        <div style=\"font-size: 11px; letter-spacing: 0.28em; opacity: 0.55; margin-bottom: 16px;\">{{ activeNum }} — IN THIS FILM<\u002Fdiv>\n        <h2 style=\"font-size: clamp(28px, 4.4vw, 42px); font-weight: 600; margin: 0 0 18px; letter-spacing: -0.005em; line-height: 1.12;\">{{ activeName }}<\u002Fh2>\n        <p style=\"font-size: clamp(14.5px, 1.7vw, 16px); font-weight: 400; line-height: 1.78; margin: 0 0 30px; opacity: 0.82; text-wrap: pretty;\">{{ activeDesc }}<\u002Fp>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px;\">\n          <sc-for list=\"{{ activeTags }}\" as=\"tag\" hint-placeholder-count=\"4\">\n            <span style=\"border: 1px solid rgba(232,223,176,0.32); border-radius: 999px; padding: 8px 17px; font-size: 12px; font-weight: 400; letter-spacing: 0.03em;\">{{ tag.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font-size: 11px; letter-spacing: 0.28em; opacity: 0.55; margin-bottom: 22px;\">WHAT THE TOUR SHOWS<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column;\">\n          <sc-for list=\"{{ activeChapters }}\" as=\"ch\" hint-placeholder-count=\"3\">\n            <div style=\"display: grid; grid-template-columns: 52px 1fr; gap: 18px; align-items: baseline; border-top: 1px solid rgba(232,223,176,0.18); padding: 18px 0;\">\n              <div style=\"font-size: 12px; letter-spacing: 0.1em; opacity: 0.5;\">{{ ch.time }}<\u002Fdiv>\n              <div>\n                <div style=\"font-size: 15px; font-weight: 600; letter-spacing: 0.01em; margin-bottom: 5px;\">{{ ch.title }}<\u002Fdiv>\n                <div style=\"font-size: 13.5px; font-weight: 400; line-height: 1.65; opacity: 0.66; text-wrap: pretty;\">{{ ch.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <a href=\"{{ activeLink }}\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-block; margin-top: 28px; background: #E8DFB0; color: #151D2A; border-radius: 999px; padding: 15px 32px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; transition: transform 0.35s cubic-bezier(0.2,0.8,0.2,1);\" style-hover=\"background: #F6F0D4; color: #151D2A; transform: translateY(-2px);\">{{ activeCta }}<\u002Fa>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"visit\" data-screen-label=\"Visit\" style=\"background: rgba(232,223,176,0.045); border-top: 1px solid rgba(232,223,176,0.14); border-bottom: 1px solid rgba(232,223,176,0.14); padding: clamp(56px, 8vw, 100px) clamp(18px, 6vw, 84px);\">\n    <div style=\"max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: clamp(30px, 4vw, 60px);\">\n      <div>\n        <h2 style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.3em; margin: 0 0 16px;\">AFTER THE TOUR<\u002Fh2>\n        <p style=\"font-size: clamp(16px, 2.2vw, 20px); font-weight: 400; line-height: 1.6; margin: 0; max-width: 420px; opacity: 0.85; text-wrap: pretty;\">The film gets you close. The room does the rest — come walk it before you commit.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 22px;\">\n        <div style=\"border-top: 1px solid rgba(232,223,176,0.22); padding-top: 16px;\">\n          <div style=\"font-size: 11px; letter-spacing: 0.2em; opacity: 0.55; margin-bottom: 8px;\">BOOK A VIEWING<\u002Fdiv>\n          <a href=\"https://wa.me/26771495774\" target=\"_blank\" rel=\"noopener\" style=\"font-size: clamp(16px, 2.4vw, 20px); font-weight: 600;\">WhatsApp us →<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"border-top: 1px solid rgba(232,223,176,0.22); padding-top: 16px;\">\n          <div style=\"font-size: 11px; letter-spacing: 0.2em; opacity: 0.55; margin-bottom: 8px;\">HOURS<\u002Fdiv>\n          <div style=\"font-size: 14.5px; font-weight: 400; line-height: 1.6; opacity: 0.8;\">Monday to Friday, 08:00 — 18:00<br>Evening events by arrangement<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 22px;\">\n        <div style=\"border-top: 1px solid rgba(232,223,176,0.22); padding-top: 16px;\">\n          <div style=\"font-size: 11px; letter-spacing: 0.2em; opacity: 0.55; margin-bottom: 8px;\">WATCH AGAIN<\u002Fdiv>\n          <a href=\"#theatre\" style=\"font-size: 14.5px; font-weight: 400; opacity: 0.85;\">Back to the tour ↑<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"border-top: 1px solid rgba(232,223,176,0.22); padding-top: 16px;\">\n          <div style=\"font-size: 11px; letter-spacing: 0.2em; opacity: 0.55; margin-bottom: 8px;\">GOOD TO KNOW<\u002Fdiv>\n          <div style=\"font-size: 14.5px; font-weight: 400; line-height: 1.6; opacity: 0.8;\">Both rooms are air-conditioned, wired for fast internet and served by the illy espresso bar.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer data-screen-label=\"Footer\" style=\"padding: clamp(60px, 9vw, 110px) clamp(18px, 6vw, 84px) clamp(50px, 7vw, 90px); text-align: center;\">\n    <div style=\"display: flex; flex-direction: column; align-items: center; gap: 18px;\">\n      <div style=\"font-size: clamp(18px, 3vw, 24px); font-weight: 600; letter-spacing: 0.36em;\">TREEHAUS<\u002Fdiv>\n      <div style=\"font-size: 11px; font-weight: 400; letter-spacing: 0.22em; opacity: 0.7;\">THE MEETING PLACE<\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 12px 26px; flex-wrap: wrap; justify-content: center; margin-top: 16px;\">\n        <a href=\"index.html\" style=\"font-size: 11.5px; letter-spacing: 0.18em; opacity: 0.75;\">HOME<\u002Fa>\n        <a href=\"#theatre\" style=\"font-size: 11.5px; letter-spacing: 0.18em; opacity: 0.75;\">THE TOUR<\u002Fa>\n        <a href=\"#visit\" style=\"font-size: 11.5px; letter-spacing: 0.18em; opacity: 0.75;\">VISIT<\u002Fa>\n        <a href=\"https://wa.me/26771495774\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 11.5px; letter-spacing: 0.18em; opacity: 0.75;\">WHATSAPP<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;boardroomDesc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A polished executive table, comfortable seating and a quiet, focused atmosphere. The walkthrough moves from the door to the head of the table, so you can judge sightlines, screen position and how the room sounds before you put a client in it.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Copy&quot;},&quot;loungeDesc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Relaxed seating, low light and a room that keeps its own company. The walkthrough shows how the lounge sits apart from the rest of the venue, for informal meetings, downtime between sessions and small gatherings that do not want a table.&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Copy&quot;}}\">\nclass Component extends DCLogic {\n  state = { active: 0, started: false };\n\n  constructor(props) {\n    super(props);\n    this.playerRef = React.createRef();\n  }\n\n  get experiences() {\n    return [\n      {\n        num: '01',\n        name: 'The Boardroom',\n        tagline: 'Where decisions get made',\n        src: 'https://pub-7e5c5a580790483ca5d647ae445505eb.r2.dev/The%20Boardroom%20Experience.mp4',\n        desc: this.props.boardroomDesc ?? 'A polished executive table, comfortable seating and a quiet, focused atmosphere. The walkthrough moves from the door to the head of the table, so you can judge sightlines, screen position and how the room sounds before you put a client in it.',\n        tags: ['Leadership meetings', 'Client pitches', 'Presentation screens', 'Air-conditioned'],\n        chapters: [\n          { time: '00:00', title: 'Arrival', note: 'The approach through the haus and into the room.' },\n          { time: '00:20', title: 'The table', note: 'Seating, spacing and where the screen sits.' },\n          { time: '00:45', title: 'Set for work', note: 'Coffee service, connectivity and the room ready to go.' }\n        ],\n        cta: 'BOOK THE BOARDROOM',\n        link: 'https://dist-lemon-xi-43.vercel.app/popups/boardroom.html'\n      },\n      {\n        num: '02',\n        name: 'The Private Lounge',\n        tagline: 'The softer side of the haus',\n        src: 'https://pub-7e5c5a580790483ca5d647ae445505eb.r2.dev/The%20Private%20Lounge%20Experience.mp4',\n        desc: this.props.loungeDesc ?? 'Relaxed seating, low light and a room that keeps its own company. The walkthrough shows how the lounge sits apart from the rest of the venue, for informal meetings, downtime between sessions and small gatherings that do not want a table.',\n        tags: ['Small groups', 'Informal meetings', 'Relaxed seating', 'Quiet zone'],\n        chapters: [\n          { time: '00:00', title: 'The way in', note: 'How the lounge is separated from the main floor.' },\n          { time: '00:18', title: 'The seating', note: 'Layout, comfort and how a small group falls into it.' },\n          { time: '00:40', title: 'The mood', note: 'Lighting and finish as the room settles into evening.' }\n        ],\n        cta: 'BOOK THE LOUNGE',\n        link: 'https://dist-lemon-xi-43.vercel.app/popups/private-dining.html'\n      },\n      {\n        num: '03',\n        name: 'The Training Room',\n        tagline: 'Built for workshops and long agendas',\n        src: 'https://pub-7e5c5a580790483ca5d647ae445505eb.r2.dev/The%20Training%20room%20.mp4',\n        desc: this.props.trainingDesc ?? 'A bright, air-conditioned classroom for workshops, trainings and team offsites. The walkthrough moves from the door across the rows of seating to the projection screen, so you can judge sightlines, layout and how the room presents before you book a session.',\n        tags: ['Workshops & training', 'Seats 24', 'Projection screen', 'Air-conditioned'],\n        chapters: [\n          { time: '00:00', title: 'Arrival', note: 'Coming in from the haus and settling into the room.' },\n          { time: '00:20', title: 'The seating', note: 'Classroom layout, spacing and sightlines to the front.' },\n          { time: '00:45', title: 'Set to present', note: 'Projection screen, connectivity and the room ready for a session.' }\n        ],\n        cta: 'BOOK THE TRAINING ROOM',\n        link: 'https://dist-lemon-xi-43.vercel.app/popups/training-room.html'\n      },\n      {\n        num: '04',\n        name: 'Office and Library',\n        tagline: 'A quiet corner for focused work',\n        src: 'https://pub-7e5c5a580790483ca5d647ae445505eb.r2.dev/The%20%20Office%20and%20Library%20.mp4',\n        desc: this.props.officeDesc ?? 'A quiet study for focused days — a proper desk, library shelving and soft daylight. The walkthrough moves from the door to the desk, so you can judge the light, the quiet and the shelving before you book it for deep work or a one-on-one.',\n        tags: ['1–4 people', 'Day-desk rates', 'Quiet zone', 'Noise cancellation room'],\n        chapters: [\n          { time: '00:00', title: 'The door in', note: 'Arrival and the shift from the haus into the quiet.' },\n          { time: '00:18', title: 'The desk', note: 'Desk, seating and how the light falls through the day.' },\n          { time: '00:38', title: 'The shelves', note: 'Library shelving and the room settling into focus.' }\n        ],\n        cta: 'BOOK THE OFFICE & LIBRARY',\n        link: 'https://dist-lemon-xi-43.vercel.app/popups/private-office.html'\n      }\n    ];\n  }\n\n  select = (i) => {\n    if (i === this.state.active) return;\n    const v = this.playerRef.current;\n    if (v) { v.pause(); v.currentTime = 0; }\n    this.setState({ active: i, started: false });\n  };\n\n  componentDidUpdate(_p, prev) {\n    if (prev.active !== this.state.active && this.playerRef.current) this.playerRef.current.load();\n  }\n\n  start = () => {\n    const v = this.playerRef.current;\n    if (!v) return;\n    v.muted = false;\n    const p = v.play();\n    if (p && p.catch) p.catch(() => {});\n    this.setState({ started: true });\n  };\n\n  handlePlay = () => {\n    if (!this.state.started) this.setState({ started: true });\n  };\n\n  renderVals() {\n    const list = this.experiences;\n    const a = list[this.state.active];\n    return {\n      playerRef: this.playerRef,\n      onStart: this.start,\n      onPlay: this.handlePlay,\n      activeSrc: a.src,\n      activeName: a.name,\n      activeNum: a.num,\n      activeDesc: a.desc,\n      activeCta: a.cta,\n      activeLink: a.link,\n      activeCounter: 'Experience ' + a.num + ' of 0' + list.length,\n      activeTags: a.tags.map(label => ({ label })),\n      activeChapters: a.chapters,\n      coverDisplay: this.state.started ? 'none' : 'flex',\n      tabs: list.map((e, i) => {\n        const on = i === this.state.active;\n        return {\n          num: e.num,\n          name: e.name,\n          tagline: e.tagline,\n          onSelect: () => this.select(i),\n          bg: on ? 'rgba(232,223,176,0.12)' : 'rgba(232,223,176,0.03)',\n          border: on ? 'rgba(232,223,176,0.55)' : 'rgba(232,223,176,0.16)',\n          numOpacity: on ? 0.9 : 0.45,\n          stateOpacity: on ? 0.85 : 0,\n          stateLabel: on ? 'NOW SHOWING' : ''\n        };\n      })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
